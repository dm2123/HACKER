name: Build HACKER APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Surface compile errors as annotations
      if: always()
      run: |
        echo "### Build errors" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        grep -E "^e: |\.kt:[0-9]+:|error:|FAILURE|w: " build.log | head -60 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        grep -E "^e: |\.kt:[0-9]+:|error:" build.log | head -40 | while IFS= read -r line; do
          echo "::error::$line"
        done

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 3

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: hacker-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
